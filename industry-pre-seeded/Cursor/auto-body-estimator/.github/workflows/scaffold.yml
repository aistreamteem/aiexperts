name: scaffold
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Integrity check
        run: python scripts/check_scaffold.py
      - name: Hook tests
        run: |
          python scripts/test_journal_hook.py
          python scripts/test_rules_hook.py
          python scripts/test_stop_hooks.py